<div id="ge-version" role="status" tabindex="0" title="Versão do app. Clique para procurar atualizações.">

</div>

<div id="ge-update" role="alertdialog" aria-live="polite" aria-hidden="true">

    <button class="ge-later" id="ge-update-later">Depois</button>
  </div>

<script>
(function () {
  // ==========================================================================
  // ATUALIZAÇÃO — REGRA ÚNICA
  // version.json é a ÚNICA fonte de verdade. Bump nele a cada deploy.
  // Qualquer mudança (index.html, sw.js, canon.js, manifest) é anunciada pelo
  // mesmo toast e aplicada pelo mesmo botão. F5 nunca é necessário.
  // ==========================================================================
  var APP_VERSION = '2026.09.21-1';   // deve bater com version.json

  var pill  = document.getElementById('ge-version');
  var label = document.getElementById('ge-version-label');
  var toast = document.getElementById('ge-update');
  var novaVersao = null;
  var aplicando = false;

  label.textContent = 'v' + APP_VERSION;
  pill.dataset.state = 'idle';

  function anunciar(v) {
    if (aplicando) return;
    novaVersao = v || null;
    pill.dataset.state = 'stale';
    label.textContent = 'v' + APP_VERSION + ' · atualização';
    toast.classList.add('show');
    toast.setAttribute('aria-hidden', 'false');
  }

  // Aplica TUDO de uma vez: ativa o SW em espera, limpa caches e recarrega.
  // Não importa se mudou o index, o sw ou um asset — o caminho é um só.
  async function aplicar() {
    aplicando = true;
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          await new Promise(function (res) {
            var t = setTimeout(res, 1500);
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              clearTimeout(t); res();
            }, { once: true });
          });
        }
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
    } catch (e) { console.error('[update]', e); }
    location.replace(location.pathname + '?v=' + Date.now());
  }

  document.getElementById('ge-update-now').addEventListener('click', function () {
    this.textContent = 'Atualizando';
    this.disabled = true;
    aplicar();
  });
  document.getElementById('ge-update-later').addEventListener('click', function () {
    toast.classList.remove('show');
    toast.setAttribute('aria-hidden', 'true');
  });

  // Consulta a versão publicada. no-store: nunca pode vir do cache.
  async function checar(porClique) {
    if (aplicando) return;
    if (porClique && pill.dataset.state !== 'stale') pill.dataset.state = 'checking';
    var servidor = null;
    try {
      var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { var j = await r.json(); servidor = j && j.version; }
    } catch (e) {}

    // Em paralelo, deixa o navegador reavaliar o sw.js (cobre o caso de o
    // version.json não ter sido bumpado por esquecimento).
    try {
      if ('serviceWorker' in navigator) {
        var reg = await navigator.serviceWorker.getRegistration();
        if (reg) { await reg.update(); if (reg.waiting) return anunciar(servidor); }
      }
    } catch (e) {}

    if (servidor && servidor !== APP_VERSION) return anunciar(servidor);

    if (porClique) {
      pill.dataset.state = 'current';
      label.textContent = 'v' + APP_VERSION + ' · atualizado';
      setTimeout(function () {
        if (pill.dataset.state === 'stale') return;
        pill.dataset.state = 'idle';
        label.textContent = 'v' + APP_VERSION;
      }, 2600);
    }
  }

  pill.addEventListener('click', function () { checar(true); });
  pill.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); checar(true); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
  // Verifica ao abrir, a cada 10 min e sempre que a aba volta ao foco.
  checar(false);
  setInterval(function () { checar(false); }, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checar(false);
  });

  // ==========================================================================
  // INSTALAÇÃO NATIVA
  // beforeinstallprompt dispara MUITO cedo — precisa ser capturado aqui, antes
  // do React montar, senão o evento se perde e o botão nunca funciona.
  // ==========================================================================
  window.__gePrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gePrompt = e;
    window.dispatchEvent(new CustomEvent('ge-instalavel'));
  });
  window.addEventListener('appinstalled', function () {
    window.__gePrompt = null;
    window.dispatchEvent(new CustomEvent('ge-instalado'));
  });
})();
</script>

<script>
const {
  useState,
  useEffect,
  useRef,
  useCallback,
  useMemo
} = React;

/* ─── CONFIG ─── */
const SB_URL = "https://ahcrscstdtfawoogsugi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY3JzY3N0ZHRmYXdvb2dzdWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjk1MDgsImV4cCI6MjEwNDIwNTUwOH0.8ivWRA99AXXyBVFT3TQd5NuSod2eiowiI490Blt2zHM";
const FN_URL = `${SB_URL}/functions/v1`;
const ADMIN_COREN = "299283";

/* ─── Sessão (Supabase Auth) ───────────────────────────────────────────────
 * O token da sessao fica aqui, em modulo, para H() poder ler de forma
 * sincrona. Sem isto, toda requisicao chega ao Postgres como anonima e
 * auth.uid() e nulo — nenhuma policy de RLS consegue distinguir quem chama.
 * Dominio do e-mail sintetico: o registro profissional vira <registro>@scfm.local
 */
const EMAIL_DOM = "@scfm.local";
const emailDeRegistro = reg => String(reg||"").trim().toLowerCase() + EMAIL_DOM;

let _accessToken = null;
const setAccessToken = t => { _accessToken = t || null; };
const getAccessToken = () => _accessToken;

/* ─── API helpers ─── */
const H = userId => ({
  "Content-Type": "application/json",
  "apikey": SB_KEY,
  // Com sessao ativa manda o JWT do usuario; sem sessao cai na anon key,
  // que com RLS ligada nao le mais nada (que e o comportamento desejado).
  "Authorization": `Bearer ${_accessToken || SB_KEY}`,
  ...(userId ? {
    "x-user-id": userId
  } : {})
});
async function sbGet(table, params = "") {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers: H()
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ─── Supabase Realtime client (carregado lazy via CDN) ─── */
let _sbClient = null;
async function getSbClient() {
  if (_sbClient) return _sbClient;
  if (!window.supabase) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
      s.onload = res;
      s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  _sbClient = window.supabase.createClient(SB_URL, SB_KEY);
  // Mantem _accessToken em sincronia com o refresh automatico do supabase-js.
  // Fica aqui (e nao em authLogin/authRestaurar) para garantir UM unico ouvinte
  // por cliente, cobrindo tanto login manual quanto sessao restaurada. Antes so
  // authRestaurar registrava: quem entrava pelo formulario ficava com o token
  // congelado e, ao expirar (1h), as escritas caiam na anon key -> erro 42501.
  _sbClient.auth.onAuthStateChange((_e, sess) => setAccessToken(sess?.access_token));
  return _sbClient;
}
/* ─── Autenticacao ─────────────────────────────────────────────────────────*/
async function authLogin(registro, senha) {
  const sb = await getSbClient();
  const { data, error } = await sb.auth.signInWithPassword({
    email: emailDeRegistro(registro), password: senha
  });
  if (error) throw new Error("Registro ou senha inválidos.");
  setAccessToken(data.session.access_token);
  return await carregarPerfil(data.session.user.id);
}

// Busca a linha de public.users correspondente. A policy users_ler_proprio
// permite ler o proprio registro; se vier vazio, o cadastro nao foi aprovado.
async function carregarPerfil(authUid) {
  const rows = await sbGet("users", `auth_uid=eq.${authUid}&limit=1`);
  if (!rows.length) {
    await authLogout();
    throw new Error("Cadastro não aprovado. Procure a administradora.");
  }
  return rows[0];
}

async function authLogout() {
  try { const sb = await getSbClient(); await sb.auth.signOut(); } catch (e) {}
  setAccessToken(null);
}

// Restaura sessao ao abrir o app (o supabase-js persiste em localStorage).
async function authRestaurar() {
  const sb = await getSbClient();
  const { data } = await sb.auth.getSession();
  if (!data.session) return null;
  setAccessToken(data.session.access_token);
  try { return await carregarPerfil(data.session.user.id); }
  catch (e) { return null; }
}

async function authTrocarSenha(novaSenha, userRowId) {
  const sb = await getSbClient();
  const { error } = await sb.auth.updateUser({ password: novaSenha });
  if (error) throw new Error(error.message);
  const r = await fetch(`${SB_URL}/rest/v1/users?id=eq.${userRowId}`, {
    method: "PATCH",
    headers: { ...H(), Prefer: "return=representation" },
    body: JSON.stringify({ senha_trocada: true })
  });
  if (!r.ok) throw new Error(await r.text());
  return (await r.json())[0];
}

async function fn(name, body, userId) {
  const r = await fetch(`${FN_URL}/${name}`, {
    method: "POST",
    headers: H(userId),
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Erro desconhecido");
  return data;
}

/* ─── CONSTANTS ─── */
const GC = {
  emergencia: {
    bg: "#FEE2E2",
    border: "#FCA5A5",
    text: "#991B1B",
    dot: "#EF4444",
    label: "Emergência",
    emoji: "🔴"
  },
  urgencia: {
    bg: "#FEF9C3",
    border: "#FDE047",
    text: "#713F12",
    dot: "#EAB308",
    label: "Urgência",
    emoji: "🟡"
  },
  andamento_cor: {
    bg: "#FEF3C7",
    border: "#FCD34D",
    text: "#92400E",
    dot: "#F59E0B",

    aceite: "ACEITE CONFIRMADO",
    psiquiatria: "PSIQUIATRIA",
    andamento: "REMOCAO EM ANDAMENTO",
    finalizado: "FINALIZADAS"
  };
  cols.forEach(col => {
    const cc = cards.filter(c => c.col_id === col.id);
    if (!cc.length) return;
    const colLabel = COL_LABEL[col.id] || col.label.toUpperCase();
    lines.push("");
    lines.push("*" + colLabel + "*");
    lines.push(cc.length + " paciente" + (cc.length !== 1 ? "s" : ""));
    lines.push(SEP);
    cc.forEach(c => {
      lines.push("");
      if (c.pr) lines.push(PR_EMOJI[c.pr] + " *PRIORIDADE " + String(c.pr).padStart(2, "0") + "*");
      const catL = {
        pediatria: "[Ped]",
        psiquiatria: "[Psi]",
        obstetricia: "[Obs]"
      };
      const catT = c.categoria && c.categoria !== "normal" ? catL[c.categoria] : c.is_rn ? "[RN]" : "";
      lines.push(`[PAC]${catT ? " " + catT : ""} *${c.nome}*${c.idade ? ` - ${c.idade}` : ""}`);
      if (c.setor) lines.push("Local: " + c.setor);
      const ambTxt = c.amb ? c.amb.includes("Av") ? "Amb. Avancada" : "Amb. Basica" : "";
      if (c.rec && c.hosp) {
        lines.push("Enc: " + c.rec + " -> " + c.hosp);
        if (ambTxt) lines.push(ambTxt);
      } else if (c.rec) {
        lines.push("Rec: " + c.rec + (ambTxt ? " | " + ambTxt : ""));
      } else if (ambTxt) {
        lines.push(ambTxt);
      }
      if (c.cross_info) lines.push("Cross: " + c.cross_info);
      if (c.receptor) lines.push("Receptor: " + c.receptor + (c.data_aceite ? " | " + c.data_aceite : "") + (c.hora_aceite ? " as " + c.hora_aceite : ""));
      if (c.status) lines.push(STATUS_EMOJI[c.status] + " *" + c.status + "*");
    });
    lines.push("");
  });
  lines.push(SEP);
  lines.push("*RESUMO*");
  lines.push("Total: *" + cards.length + " pacientes*");
  cols.forEach(col => {
    const n = cards.filter(c => c.col_id === col.id).length;
    if (n > 0) lines.push((COL_LABEL[col.id] || col.label) + ": " + n);
  });
  lines.push(appLink);
  return lines.join("\n");
}

// Normaliza cabeçalho para comparação (remove acentos, minúsculas, espaços extras)
function normKanbanHdr(s){
  // B2: remove pontuacao ANTES de colapsar espaco. Sem isto, cabecalhos reais
  // do CROSS ("Nº DA FICHA CROSS", "LOCALIZACAO/SETOR") nao casam com o mapa,
  // matched cai abaixo de 40% e o lote inteiro entra deslocado.
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u00a0\u200b-\u200d\ufeff]/g," ")
    .replace(/[.\-_/\\,;:\u00ba\u00b0\u00aa'"()\[\]]/g," ")
    .toLowerCase().replace(/\s+/g," ").trim();
}

function normKanbanAmb(v){

  if(u==="BASICA"||u==="SBV"||u==="BASICO")return "Básica";

// Similaridade de strings (Dice bigram)
function strSim(a, b) {
  if (!a || !b) return 0;
  a = a.toUpperCase().trim(); b = b.toUpperCase().trim();
  if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return 0;
  const bg = s => { const m = new Map(); for (let i=0;i<s.length-1;i++){const k=s[i]+s[i+1];m.set(k,(m.get(k)||0)+1);} return m; };
  const aB=bg(a),bB=bg(b); let inter=0;
  for (const [k,v] of aB) inter+=Math.min(v,bB.get(k)||0);
  return (2*inter)/(a.length+b.length-2);
}

      ?React.createElement("span",null,a.nome,a.reg?React.createElement("span",{style:{fontWeight:500,color:"#64748B"}}," \u00B7 ",a.reg):null)
      :React.createElement("span",null,"Autoria nao registrada"),
    p.preenchido_em?React.createElement("span",{style:{fontWeight:500,color:"#94A3B8"}}," \u00B7 ",lsQuando(p.preenchido_em)):null
  );
}


function LivroSaida({currentUser,userId,onClose,onPendentesChange}){
  const [tab,setTab]=useState("novo");
  const [form,setForm]=useState({...LS_EMPTY});
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const [pendentes,setPendentes]=useState([]);
  const [loadingP,setLoadingP]=useState(false);
  const [erroP,setErroP]=useState(null);
  const [todos,setTodos]=useState([]);
  const [loadingT,setLoadingT]=useState(false);
  const [erroT,setErroT]=useState(null);
  const [confirmIgnorar,setConfirmIgnorar]=useState(null);
  const [match,setMatch]=useState(null);
  const [vinculando,setVinculando]=useState(false);
  const [remocoes,setRemocoes]=useState([]);
  const [toast,setToast]=useState(null);
  const [confirmClose,setConfirmClose]=useState(false);
  // Vinculo e decisao da administracao. Enfermeiro so preenche o livro.
  // O bloqueio real esta no banco (vinculo-somente-admin.sql); isto aqui
  // apenas evita oferecer uma acao que o servidor vai recusar.
  const podeVincular = currentUser?.role === "admin";
  const [auditoria,setAuditoria]=useState(null);   // {registro, linhas|null, erro|null}
  const [loadingA,setLoadingA]=useState(false);

  const notify=(tipo,texto)=>setToast({tipo,texto});
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),4500);return()=>clearTimeout(t);},[toast]);

  // Traduz o erro cru do PostgREST numa mensagem util para quem esta no plantao.
  function msgErro(e){
    const t=String(e&&e.message||e||"");
    if(t.includes("42501")||t.includes("row-level security"))
      return "Sua sessao expirou ou voce nao tem permissao para lancar no Livro. Saia e entre novamente; se continuar, procure a coordenacao.";
    if(t.includes("Failed to fetch")||t.includes("NetworkError"))
      return "Sem conexao com o servidor. Os dados continuam na tela — tente salvar de novo.";
    return "Nao foi possivel salvar. Detalhe tecnico no console.";
  }

  // Ha algo digitado que seria perdido ao fechar?
  const dirty=Object.keys(LS_EMPTY).some(k=>form[k]!==LS_EMPTY[k]);
  const pedirFechar=()=>{ if(dirty)setConfirmClose(true); else onClose(); };

  useEffect(()=>{loadPendentes();loadRemocoes();},[]);
  useEffect(()=>{if(tab==="todos")loadTodos();},[tab]);

  // fetch NAO lanca em 401/403 — sem checar r.ok, o corpo de erro virava []
  // e a tela dizia "Nenhum pendente", mascarando falha como sucesso.
  async function loadPendentes(){
    setLoadingP(true);setErroP(null);
    try{
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida?status_vinculo=eq.pendente&order=created_at.desc`,{headers:LS_H()});
      if(!r.ok)throw new Error(await r.text());
      const d=await r.json();
      if(!Array.isArray(d))throw new Error("Resposta inesperada do servidor.");
      setPendentes(d);if(onPendentesChange)onPendentesChange(d.length);
    }catch(e){console.error("[LivroSaida] falha ao carregar pendentes:",e);setErroP(msgErro(e));}
    setLoadingP(false);
  }

  // Aba "Todos": sem filtro de status. Antes, qualquer registro que saisse de
  // "pendente" ficava inalcancavel pela interface.
  async function loadTodos(){
    setLoadingT(true);setErroT(null);
    try{
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida?order=created_at.desc&limit=500`,{headers:LS_H()});
      if(!r.ok)throw new Error(await r.text());
      const d=await r.json();
      if(!Array.isArray(d))throw new Error("Resposta inesperada do servidor.");
      setTodos(d);
    }catch(e){console.error("[LivroSaida] falha ao carregar histórico:",e);setErroT(msgErro(e));}
    setLoadingT(false);
  }

  // Devolve um registro para a fila de pendentes (desfaz "sem vínculo").
  async function handleReabrir(livroId){
    try{
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida?id=eq.${livroId}`,{method:"PATCH",headers:{...LS_H(),Prefer:"return=minimal"},body:JSON.stringify({status_vinculo:"pendente",remocao_id:null})});
      if(!r.ok)throw new Error(await r.text());
      loadPendentes();loadTodos();
      notify("ok","Registro devolvido para Pendentes.");
    }catch(e){console.error("[LivroSaida] falha ao reabrir:",e);notify("erro",msgErro(e));}
  }
  // Historico completo de um registro. Somente leitura: a tabela de log nao
  // aceita INSERT/UPDATE/DELETE de cliente nenhum (ver auditoria-livro.sql).
  async function abrirAuditoria(registro){
    setAuditoria({registro,linhas:null,erro:null});
    setLoadingA(true);
    try{
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida_log?livro_id=eq.${registro.id}&order=criado_em.asc`,{headers:LS_H()});
      if(!r.ok)throw new Error(await r.text());
      const d=await r.json();
      if(!Array.isArray(d))throw new Error("Resposta inesperada do servidor.");
      setAuditoria({registro,linhas:d,erro:null});
    }catch(e){
      console.error("[LivroSaida] falha ao carregar auditoria:",e);
      setAuditoria({registro,linhas:null,erro:msgErro(e)});
    }
    setLoadingA(false);
  }

  async function loadRemocoes(){
    try{const r=await fetch(`${SB_URL}/rest/v1/remocoes?select=id,nome_paciente,data_solicitacao,ficha_cross&order=data_solicitacao.desc&limit=300`,{headers:LS_H()});const d=await r.json();setRemocoes(Array.isArray(d)?d:[]);}catch(e){}
  }

  const set=(k,v)=>{setForm(p=>({...p,[k]:v}));setErrors(p=>({...p,[k]:false}));};

  function validate(){
    const errs={};
    LS_REQUIRED.forEach(k=>{if(!form[k]||String(form[k]).trim()==="")errs[k]=true;});
    setErrors(errs);
    return Object.keys(errs).length===0;
  }

  function findMatches(nome,data){
    if(!nome)return[];
    return remocoes
      .map(r=>({...r,sim:strSim(r.nome_paciente,nome)}))
      .filter(r=>{const sd=data&&r.data_solicitacao&&r.data_solicitacao.startsWith(data);return r.sim>=0.75||(r.sim>=0.55&&sd);})
      .sort((a,b)=>b.sim-a.sim).slice(0,5);
  }

  async function handleSalvar(){
    if(!validate())return;
    setSaving(true);
    try{
      const payload={...form,finalizado:Boolean(form.finalizado),permaneceu:Boolean(form.permaneceu),preenchido_por:userId||null,status_vinculo:"pendente"};
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida`,{method:"POST",headers:{...LS_H(),Prefer:"return=representation"},body:JSON.stringify(payload)});
      if(!r.ok)throw new Error(await r.text());
      const [saved]=await r.json();
      const candidates=findMatches(form.nome_paciente,form.data_saida);
      if(candidates.length>0){setMatch({livroRow:saved,candidates});}
      else{setForm({...LS_EMPTY});loadPendentes();notify("ok","Registro salvo. Sem correspondência na planilha — ficou em Pendentes.");}
    }catch(e){console.error("[LivroSaida] falha ao salvar:",e);notify("erro",msgErro(e));}
    setSaving(false);
  }

  async function handleVincular(livroId,remocaoId){
    setVinculando(true);
    try{
      await fetch(`${SB_URL}/rest/v1/livro_saida?id=eq.${livroId}`,{method:"PATCH",headers:{...LS_H(),Prefer:"return=minimal"},body:JSON.stringify({remocao_id:remocaoId,status_vinculo:"vinculado"})});
      const livroEntry=match?.livroRow||pendentes.find(p=>p.id===livroId);
      if(livroEntry&&remocaoId){
        const u={};
        if(livroEntry.ambulancia)u.tipo_ambulancia=livroEntry.ambulancia;
        if(livroEntry.hora_solic_ambulancia)u.hora_solic_ambulancia=livroEntry.hora_solic_ambulancia;
        if(livroEntry.hora_saida)u.horario_saida_ambulancia=livroEntry.hora_saida;
        if(livroEntry.hora_retorno)u.horario_retorno=livroEntry.hora_retorno;
        if(livroEntry.medico)u.medico=livroEntry.medico;
        if(livroEntry.enfermeiro)u.enfermeiro=livroEntry.enfermeiro;
        if(livroEntry.tecnico_auxiliar)u.tecnico_auxiliar=livroEntry.tecnico_auxiliar;
        if(livroEntry.destino)u.instituicao_destino=livroEntry.destino;
        if(livroEntry.observacao)u.observacao=livroEntry.observacao;
        u.finalizado=Boolean(livroEntry.finalizado);
        u.permaneceu=Boolean(livroEntry.permaneceu);
        if(Object.keys(u).length>0)await fetch(`${SB_URL}/rest/v1/remocoes?id=eq.${remocaoId}`,{method:"PATCH",headers:{...LS_H(),Prefer:"return=minimal"},body:JSON.stringify(u)});
      }
      setMatch(null);setForm({...LS_EMPTY});loadPendentes();
      notify("ok","Vinculado. Dados mesclados na planilha de remoção.");
    }catch(e){console.error("[LivroSaida] falha ao vincular:",e);notify("erro",msgErro(e));}
    setVinculando(false);
  }

  async function handleIndependente(livroId){
    try{
      const r=await fetch(`${SB_URL}/rest/v1/livro_saida?id=eq.${livroId}`,{method:"PATCH",headers:{...LS_H(),Prefer:"return=minimal"},body:JSON.stringify({status_vinculo:"independente"})});
      if(!r.ok)throw new Error(await r.text());
      setMatch(null);setForm({...LS_EMPTY});setConfirmIgnorar(null);loadPendentes();if(tab==="todos")loadTodos();
      notify("ok","Registro mantido sem vínculo. Continua no histórico, na aba Todos.");
    }catch(e){console.error("[LivroSaida] falha ao marcar independente:",e);notify("erro",msgErro(e));}
  }

        React.createElement("div",{className:"ls-match-box",style:{maxWidth:400}},
          React.createElement("div",{style:{fontWeight:700,fontSize:15,marginBottom:6}},"Descartar este registro?"),
          React.createElement("div",{style:{fontSize:12,color:"#64748B",lineHeight:1.5,marginBottom:18}},"Os dados digitados ainda não foram salvos e serão perdidos."),
          React.createElement("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
            React.createElement("button",{onClick:()=>setConfirmClose(false),style:{background:"#0F172A",color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontSize:12,fontWeight:700,cursor:"pointer"}},"Continuar preenchendo"),
            React.createElement("button",{onClick:()=>{setConfirmClose(false);onClose();},style:{background:"none",border:"1px solid #FECACA",color:"#DC2626",borderRadius:8,padding:"8px 18px",fontSize:12,fontWeight:600,cursor:"pointer"}},"Descartar")
          )
        )

      // ── Confirmacao de "Sem vinculo" ──

          React.createElement("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
            React.createElement("button",{onClick:()=>setConfirmIgnorar(null),style:{background:"none",border:"1px solid #E2E8F0",color:"#374151",borderRadius:8,padding:"8px 18px",fontSize:12,cursor:"pointer"}},"Cancelar"),

      // ── Toast ──
      toast&&React.createElement("div",{onClick:()=>setToast(null),style:{position:"absolute",top:14,left:"50%",transform:"translateX(-50%)",zIndex:20,maxWidth:"90%",display:"flex",alignItems:"flex-start",gap:9,background:toast.tipo==="ok"?"#062B1B":"#3F1114",color:"#fff",borderRadius:10,padding:"11px 15px",fontSize:12,lineHeight:1.45,fontWeight:500,boxShadow:"0 10px 30px rgba(0,0,0,.3)",cursor:"pointer",animation:"lsToastIn .2s ease-out"}},

/* Administracao de usuarios. Criar conta no Auth e redefinir senha exigem a
 * service_role key — por isso passam pela Edge Function users-admin, nunca
 * pelo front. A propria funcao confere, a partir do JWT, se quem chama e
 * admin aprovado; o front so desenha a tela. */
async function adminUsuarios(action, id, extra) {
  return await fn("users-admin", { action, id, ...(extra || {}) });
}

// Liga/desliga uma area de escrita (can_kanban | can_planilha | can_livro).
// Antes era um PATCH direto no REST com a anon key — com RLS ligada isso
// nao passa mais, e nem deveria: permissao se altera no servidor.
async function toggleFlag(uid, campo, atual, reload) {
  await adminUsuarios("flags", uid, { flags: { [campo]: !atual } });
  reload();
}

function calcDeltaMin(createdAt, horaStr) {
  if (!createdAt || !horaStr) return null;
  try {
    const base = new Date(createdAt);
    const [h, m] = horaStr.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const target = new Date(base);
    target.setHours(h, m, 0, 0);
    const diff = (target - base) / 60000;
    return diff >= 0 ? diff : null;
  } catch { return null; }
}
function fmtDelta(min) {
  if (min === null || min === undefined) return null;
  if (min < 60) return Math.round(min) + " min";
  const h = Math.floor(min / 60);
  const rm = Math.round(min % 60);
  return h + "h" + (rm > 0 ? String(rm).padStart(2, "0") : "");
}
function TempoTag({ label, color, bg }) {
  if (!label) return null;
  return React.createElement("span", {
    style: { fontSize:9, fontWeight:700, padding:"2px 7px", borderRadius:99,
      background: bg||"#F0F9FF", color: color||"#0369A1",
      border:`1px solid ${color||"#0369A1"}33`, whiteSpace:"nowrap" }
  }, label);
}

  /* form como ref para não re-renderizar a cada keystroke */
  var formRef = React.useRef({titulo:"",descricao:"",prioridade:"",responsavel_id:"",prazo:""});
  var [formV, setFormV] = React.useState(0); // version só para forçar re-render quando necessário

  function getForm(){ return formRef.current; }
  function setField(k,v){ formRef.current = Object.assign({},formRef.current,{[k]:v}); }

  function showT(msg,type){ setToastMsg({msg,type:type||"ok"}); setTimeout(function(){setToastMsg(null);},4000); }

  React.useEffect(function(){ load(); loadUsers(); },[]);

  async function load(){
    setLoading(true);
    try{
      var r=await fetch(SB_URL+"/rest/v1/acoes_enfermagem?order=prioridade.asc.nullslast,created_at.asc&limit=300",{headers:H()});
      setAcoes(await r.json());

    setLoading(false);
  }
  async function loadUsers(){
    try{ setUsers(await sbGet("users","status=eq.aprovado&order=nome.asc")); }catch(e){}
  }

  async function callFn(body){
    var r=await fetch(FN_URL+"/acoes-write",{method:"POST",headers:H(userId),body:JSON.stringify(body)});
    var d=await r.json();
    if(!r.ok) throw new Error(d.error||"Erro");
    return d;
  }

  /* Prazo: converte datetime-local (sem tz) para ISO com -03:00 */
  function prazoISO(val){ return val ? val+":00-03:00" : null; }

  async function handleSave(){
    var f=getForm();
    if(!f.titulo.trim()){ showT("Título obrigatório","err"); return; }
    var pr=f.prioridade?parseInt(f.prioridade,10):null;
    var resp=users.find(function(u){return u.id===f.responsavel_id;});
    var body={
      titulo:f.titulo.trim(), descricao:f.descricao.trim()||null,
      prioridade:pr,
      responsavel_id:f.responsavel_id||null,
      responsavel_nome:resp?resp.nome:null,
      prazo:prazoISO(f.prazo),
    };
    try{
      if(editing){
        await callFn({action:"update",id:editing.id,body:body});
        showT("Tarefa atualizada.");
      } else {
        await callFn({action:"create",body:body});
        showT("Tarefa criada.");
      }
      setEditing(null);
      formRef.current={titulo:"",descricao:"",prioridade:"",responsavel_id:"",prazo:""};
      setConflito(null);
      setAba("pendentes");
      load();
    } catch(ex){
      if(ex.message&&ex.message.includes("já está com:")){
        setConflito({msg:ex.message});
        setFormV(function(v){return v+1;});
      } else {
        showT(ex.message,"err");
      }

/* ── FloatingActions: balão flutuante de alertas (admin only) ── */
function FloatingActions({ cards, discrepancias, pendencias, setView }) {
  var [open, setOpen] = React.useState(false);
  var emergP  = (cards||[]).filter(function(c){return c.grav==="emergencia"&&c.col_id==="pendente";}).length;
  var semHosp = (cards||[]).filter(function(c){return !c.hosp&&c.col_id!=="finalizado";}).length;
  var disc    = (discrepancias||[]).length;
  var pend    = (pendencias||0);
  var total   = emergP + disc + pend + (semHosp > 0 ? 1 : 0);
  if(total === 0) return null;
  var items = [];
  if(emergP>0)   items.push({cor:"#EF4444",label:emergP+" emergênci"+(emergP===1?"a":"as")+" pendente"+(emergP===1?"":"s"),acao:function(){setView("kanban");},dica:"Pacientes com emergência aguardando aceite"});
  if(disc>0)     items.push({cor:"#F59E0B",label:disc+" discrepânci"+(disc===1?"a":"as")+" de fila",acao:function(){setView("dashboard");},dica:"Menor gravidade com aceite antes de mais grave na mesma especialidade"});
  if(pend>0)     items.push({cor:"#B91C1C",label:pend+" valor"+(pend===1?"":"es")+" a corrigir",acao:function(){setView("dashboard");},dica:"Valores não classificados na planilha de remoções"});
  if(semHosp>0)  items.push({cor:"#94A3B8",label:semHosp+" card"+(semHosp===1?"":"s")+" sem hospital",acao:function(){setView("kanban");},dica:"Cards ativos sem hospital receptor definido"});
  return React.createElement("div", {id:"ge-fab"},
    open && React.createElement("div", {
      style:{background:"#0F172A",borderRadius:12,padding:"10px 14px",minWidth:230,boxShadow:"0 8px 32px rgba(0,0,0,.3)",marginBottom:6}
    },
      React.createElement("div", {style:{fontSize:10,fontWeight:700,color:"#475569",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}, "A\u00E7\u00F5es pendentes"),
      items.map(function(item,i){
        return React.createElement("div", {
          key:i, onClick:function(){item.acao();setOpen(false);}, title:item.dica,
          style:{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:i?"1px solid #1E293B":"none",cursor:"pointer"}
        },
          React.createElement("div", {style:{width:8,height:8,borderRadius:"50%",background:item.cor,flexShrink:0}}),
          React.createElement("span", {style:{fontSize:12,color:"#F1F5F9",flex:1}}, item.label),
          React.createElement("span", {style:{fontSize:11,color:"#475569"}}, "\u2192")
        );
      })
    ),
    React.createElement("button", {
      onClick:function(){setOpen(function(p){return !p;});},
      style:{width:46,height:46,borderRadius:"50%",border:"none",background:"#EF4444",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 16px rgba(239,68,68,.4)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0}
    },

      React.createElement("span", {style:{position:"absolute",top:-2,right:-2,width:10,height:10,borderRadius:"50%",background:"#F59E0B",border:"2px solid #fff"}})
    )
  );
}

function App() {

  const [mobileOpen, setMobileOpen] = useState(null);
  const [sortCol, setSortCol] = useState(null);

  const [toast, setToast] = useState(null);

  const [snapshots, setSnapshots] = useState(() => loadLS("ge_snapshots", []));

  const dragId = useRef(null);
  const dragOverCol = useRef(null);
  const dragColId = useRef(null);
  const newColRef = useRef(null);
  const isAdmin = currentUser?.role === "admin";
  // Espelho no front das policies do banco. Se divergirem, o usuario ve um
  // botao que o Postgres recusa — pior que nao ver botao nenhum.
  const podeKanban   = isAdmin || !!currentUser?.can_kanban;
  const podePlanilha = isAdmin || !!currentUser?.can_planilha;
  const podeLivro    = isAdmin || !!currentUser?.can_livro;
  const userId = currentUser?.id || "";

  const displayCards = isAdmin ? cards : pubCards || [];
  const displayCols = isAdmin ? cols : pubCols || cols;

  // ===== Funções de login/logout =====
  function handleLogin(user) {
    setCurrentUser(user);
  }

  async function handleLogout() {
    await authLogout();
    setCurrentUser(null);
  }


  /* ── Funções de sincronização de snapshots ── */
  async function syncColsToDb(colsToSync) {
    const result = [];
    for (const col of colsToSync) {
      try {
        const created = await fn("columns-write", { action: "create", body: col }, userId);
        result.push(created);
      } catch (e) {
        result.push(col);
      }
    }
    return result;
  }

  async function syncCardsToDb(cardsToSync) {
    const result = [];
    for (const card of cardsToSync) {
      const { id, ...body } = card;
      try {
        const created = await fn("cards-write", { action: "create", body }, userId);
        result.push(created);
      } catch (e) {
        console.error("Erro ao criar card:", e);
        showT("Erro ao sincronizar card: " + e.message, "err");
        result.push(card);
      }
    }
    return result;
  }

  // Aplica um snapshot criando as colunas e cards no Supabase
  async function applySnapshot(cardsData, colsData) {
    setLoading(true);
    const fails = [];
    try {
      const syncedCols = await syncColsToDb(colsData || cols);
      const cardsToSync = cardsData || [];
      const syncedCards = [];
      for (const card of cardsToSync) {
        const { id, ...body } = card;
        try {
          const created = await fn("cards-write", { action: "create", body }, userId);
          syncedCards.push(created);
        } catch (e) {
          fails.push({ nome: card.nome || "(sem nome)", erro: e.message || "erro desconhecido" });
          syncedCards.push(card);
        }
      }
      setCols(syncedCols);
      setCards(syncedCards);
      setShowSnapPanel(false);
      setImportResult({ ok: syncedCards.length - fails.length, total: cardsToSync.length, fails });
    } catch (err) {
      showT("Erro ao aplicar snapshot: " + err.message, "err");
    } finally {
      setLoading(false);
    }
  }

  // Carrega um snapshot do estado local
  function loadSnapshot(snap) {
    applySnapshot(snap.cards, snap.cols);
  }

  // Remove um snapshot do estado e do localStorage
  function deleteSnapshot(id) {
    if (!window.confirm("Remover este snapshot?")) return;
    const updated = snapshots.filter(s => s.id !== id);
    saveLS("ge_snapshots", updated);
    setSnapshots(updated);
    showT("Snapshot removido.");
  }

  // Importa um arquivo JSON
  function importSnapshotFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const snap = JSON.parse(e.target.result);
        applySnapshot(snap.cards, snap.cols);
      } catch (err) {
        showT("Erro ao importar: " + err.message, "err");
      }
    };
    reader.readAsText(file);
  }

  /* ── Demais funções (loadAll, move, etc.) ── */
  useEffect(() => {
    if (!currentUser) return;
    loadAll();
    let last = Date.now();
    const ivUsers = setInterval(async () => {
      if (!isAdmin) return;
      try {
        const rows = await sbGet("users", `status=eq.pendente&created_at=gt.${new Date(last).toISOString()}`);
        if (rows.length) {
          last = Date.now();
          showT(`📋 ${rows.length} novo(s) cadastro(s) aguardando aprovação!`);
        }
      } catch {}
    }, 5000);
    let realtimeChannel = null;
    let lastPubId = null;
    getSbClient().then(sb => {
      realtimeChannel = sb.channel("publications-changes").on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "publications"
      }, payload => {
        const p = payload.new;
        if (!p || p.id === lastPubId) return;
        lastPubId = p.id;
        const isAutoSnap = (p.label || "").includes("automático");
        if (isAutoSnap) return;
        const snap = p.snapshot || {};
        setPubCards(snap.cards || []);
        setPubCols(snap.cols || []);
        setLastPub(new Date(p.created_at).toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }));
        if (!isAdmin) showT("🔄 Kanban atualizado pela administradora!");
      }).on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "users"
      }, payload => {
        const u = payload.new;
        if (isAdmin && u?.status === "pendente") showT(`📋 Novo cadastro pendente: ${u.nome}`);
      }).subscribe();
    }).catch(() => {
      const ivPub = setInterval(async () => {
        try {
          const allPubs = await sbGet("publications", "order=created_at.desc&limit=10");
          const pub = allPubs.find(p => !(p.label || "").includes("automático"));
          if (!pub) return;
          if (pub.id === lastPubId) return;
          lastPubId = pub.id;
          const snap = pub.snapshot || {};
          setPubCards(snap.cards || []);
          setPubCols(snap.cols || []);
          setLastPub(new Date(pub.created_at).toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }));
          if (!isAdmin) showT("🔄 Kanban atualizado!");
        } catch {}
      }, 15000);
      return () => clearInterval(ivPub);
    });
    return () => {
      clearInterval(ivUsers);
      if (realtimeChannel) getSbClient().then(sb => sb.removeChannel(realtimeChannel)).catch(() => {});
    };
  }, [currentUser]);

  const knownComIds = useRef(new Set());
  const cardsRef = useRef([]);
  useEffect(() => {
    cardsRef.current = cards;
  }, [cards]);
  useEffect(() => {
    if (!currentUser) return;
    Object.values(comments).flat().forEach(c => knownComIds.current.add(c.id));
    let comChannel = null;
    getSbClient().then(sb => {
      comChannel = sb.channel("comments-realtime-" + currentUser.id).on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "comments"
      }, payload => {
        const c = payload.new;
        if (!c || knownComIds.current.has(c.id)) return;
        if (c.autor_id === currentUser.id) {
          knownComIds.current.add(c.id);
          return;
        }
        knownComIds.current.add(c.id);
        setComments(prev => {
          const next = { ...prev };
          const existing = next[c.card_id] || [];
          if (!existing.find(x => x.id === c.id)) next[c.card_id] = [...existing, c];
          return next;
        });
        const cardName = cardsRef.current.find(k => k.id === c.card_id)?.nome || "card";
        setNewComAlerts(prev => [...prev, {
          id: c.id,
          card_id: c.card_id,
          card_nome: cardName,
          autor: c.autor_nome,
          texto: c.texto,
          hora: new Date(c.created_at).toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          })
        }]);
        setShowComPanel(true);
      }).subscribe();
    }).catch(() => {
      const iv = setInterval(async () => {
        try {
          const currentCards = cardsRef.current;
          if (!currentCards.length) return;
          const ids = currentCards.map(x => x.id).join(",");
          const newComs = await sbGet("comments", `card_id=in.(${ids})&order=created_at.desc&limit=30`);
          const toProcess = newComs.filter(c => !knownComIds.current.has(c.id) && c.autor_id !== currentUser.id);
          newComs.forEach(c => knownComIds.current.add(c.id));
          if (toProcess.length) {
            setComments(prev => {
              const next = { ...prev };
              toProcess.forEach(c => {
                const ex = next[c.card_id] || [];
                if (!ex.find(x => x.id === c.id)) next[c.card_id] = [...ex, c];
              });
              return next;
            });
            setNewComAlerts(prev => [...prev, ...toProcess.map(c => ({
              id: c.id,
              card_id: c.card_id,
              card_nome: cardsRef.current.find(k => k.id === c.card_id)?.nome || "card",
              autor: c.autor_nome,
              texto: c.texto,
              hora: new Date(c.created_at).toLocaleString("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
              })
            }))]);
            setShowComPanel(true);
          }
        } catch {}
      }, 8000);
      return () => clearInterval(iv);
    });
    return () => {
      if (comChannel) getSbClient().then(sb => sb.removeChannel(comChannel)).catch(() => {});
    };
  }, [currentUser]);

  useEffect(() => {
    function handleKey(e) {
      if (!currentUser || !isAdmin) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (e.key === "n" || e.key === "N") {
        e.preventDefault();
        newCard();
      }
      if (e.key === "p" || e.key === "P") {
        e.preventDefault();
        setShowPub(true);
      }
      if (e.key === "Escape") {
        setSelected(null);
        setShowPub(false);
        setShowShare(false);
        setShowSettings(false);
      }
    }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [currentUser, isAdmin]);

  async function loadAll() {
    setLoading(true);
    try {
      const [c, cl, s, pub] = await Promise.all([
        sbGet("cards", "order=card_order.asc,created_at.asc"),
        sbGet("columns", "order=col_order.asc"),
        sbGet("settings", "id=eq.1&limit=1"),
        sbGet("publications", "order=created_at.desc&label=not.like.*automático*&limit=10")
      ]);
      setCards(c);
      window.__geCards = c;
      setCols(cl);
      if (s.length) setSettings(s[0]);
      const manualPub = pub.find(p => !(p.label || "").includes("automático"));
      if (manualPub) {
        const snap = manualPub.snapshot;
        setPubCards(snap.cards || []);
        setPubCols(snap.cols || cl);
        setLastPub(new Date(manualPub.created_at).toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }));
      }
      if (c.length) {
        const ids = c.map(x => x.id).join(",");
        const coms = await sbGet("comments", `card_id=in.(${ids})&order=created_at.asc`);
        const g = {};
        coms.forEach(cm => {
          g[cm.card_id] = [...(g[cm.card_id] || []), cm];
        });
        setComments(g);
      }
    } catch (e) {
      showT("Erro ao carregar dados.", "err");
    }
    setLoading(false);
    if (isAdmin) setTimeout(() => maybeAutoSnapshot(), 2000);
  }

  async function maybeAutoSnapshot() {
    if (!isAdmin) return;
    const key = "ge_auto_snap_" + new Date().toISOString().split("T")[0];
    if (loadLS(key, false)) return;
    try {
      await fn("publish", { label: "Snapshot automático " + todayStr() }, userId);
      saveLS(key, true);
    } catch {}
  }

  function showT(msg, type = "ok") {

  /* ── CRUD cards ── */
  async function onSave(form) {
    try {
      const action = form.id === "new" ? "create" : "update";
      const data = await fn("cards-write", { action, id: form.id, body: form }, userId);
      if (action === "create") setCards(p => { const next = [...p, data]; window.__geCards = next; return next; });
      else setCards(p => { const next = p.map(c => c.id === form.id ? data : c); window.__geCards = next; return next; });
      showT("Salvo.");
    } catch (ex) {
      showT(ex.message, "err");
    }
    setSelected(null);
  }

  async function onDel(id) {
    if (!window.confirm("Remover este card?")) return;
    await onDelSilent(id);
  }
  async function onDelSilent(id) {
    try {
      const data = await fn("cards-write", { action: "delete", id }, userId);
      const deleted = data.deleted;
      setCards(p => p.filter(c => c.id !== id));
      setSelected(null);
      const timer = setTimeout(async () => {
        setUndoQueue(q => q.filter(x => x.id !== id));
      }, 15000);
      setUndoQueue(q => [...q, { id, card: deleted, timer }]);
    } catch (ex) {
      showT(ex.message, "err");
      throw ex;
    }
  }

  async function onDelAll() {
    if (cards.length === 0) return;
    const conf = window.prompt(`Isso vai excluir TODOS os ${cards.length} cards do Kanban, permanentemente. Digite EXCLUIR para confirmar:`);
    if (conf !== "EXCLUIR") return;
    let ok = 0, fail = 0;
    for (const c of [...cards]) {
      try {
        await fn("cards-write", { action: "delete", id: c.id }, userId);
        ok++;
      } catch (ex) { fail++; }
    }
    setCards([]);
    setSelected(null);
    showT(`${ok} card(s) excluído(s)${fail > 0 ? ` — ${fail} falharam` : ""}.`, fail > 0 ? "err" : "ok");
  }

  async function undoDelete(id) {
    const item = undoQueue.find(x => x.id === id);
    if (!item) return;
    clearTimeout(item.timer);
    setUndoQueue(q => q.filter(x => x.id !== id));
    try {
      const data = await fn("cards-write", { action: "restore", body: item.card }, userId);
      setCards(p => [...p, data]);
      showT("Card restaurado!");
    } catch (ex) {
      showT(ex.message, "err");
    }
  }

  async function moveCard(cardId, newColId, aceiteData) {
    try {
      const data = await fn("cards-move", { card_id: cardId, new_col_id: newColId, aceite: aceiteData || null }, userId);
      setCards(p => { const next = p.map(c => c.id === cardId ? data : c); window.__geCards = next; return next; });
      showT("Card movido.");

  function handleMoveAttempt(cardId, newColId) {
    if (newColId === "aceite") {
      const card = cards.find(c => c.id === cardId);
      setPendingMove({ card, newColId });
    } else {
      moveCard(cardId, newColId);
    }
  }

  function handleDragStart(e, cardId) {
    dragId.current = cardId;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(cardId));
    requestAnimationFrame(() => {
      if (e.currentTarget) e.currentTarget.style.opacity = ".35";
    });
  }
  function handleDragEnd(e) {
    dragId.current = null;
    if (e.currentTarget) e.currentTarget.style.opacity = "1";
    document.querySelectorAll("[data-dropzone]").forEach(z => {
      z.style.borderColor = "#E2E8F0";
      z.style.boxShadow = "none";
    });
    dragOverCol.current = null;
  }
  function handleDrop(e, colId) {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || dragId.current;
    if (!id) return;
    handleMoveAttempt(id, colId);
  }
  function handleDragOver(e, colId) {
    e.preventDefault();
    if (dragOverCol.current === colId) return;
    if (dragOverCol.current) {
      const p = document.querySelector(`[data-dropzone="${dragOverCol.current}"]`);
      if (p) {
        p.style.borderColor = "#E2E8F0";
        p.style.boxShadow = "none";
      }
    }
    dragOverCol.current = colId;
    const el = document.querySelector(`[data-dropzone="${colId}"]`);
    if (el) {
      el.style.borderColor = "#3B82F6";
      el.style.boxShadow = "0 0 0 3px rgba(59,130,246,.15)";
    }
  }
  function handleDragLeave(e, colId) {
    if (e.currentTarget.contains(e.relatedTarget)) return;
    const el = document.querySelector(`[data-dropzone="${colId}"]`);
    if (el) {
      el.style.borderColor = "#E2E8F0";
      el.style.boxShadow = "none";
    }
    if (dragOverCol.current === colId) dragOverCol.current = null;
  }

  /* ── Reordenar colunas ── */
  function handleColDragStart(e, colId) {
    dragColId.current = colId;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/col", colId);
    requestAnimationFrame(function(){ if(e.currentTarget) e.currentTarget.style.opacity=".45"; });
  }
  function handleColDragEnd(e) { dragColId.current=null; if(e.currentTarget) e.currentTarget.style.opacity="1"; }
  async function handleColDrop(e, targetColId) {
    e.preventDefault(); e.stopPropagation();
    var srcId=dragColId.current||e.dataTransfer.getData("text/col");
    if(!srcId||srcId===targetColId) return;
    var arr=cols.slice(), si=arr.findIndex(function(c){return c.id===srcId;}), ti=arr.findIndex(function(c){return c.id===targetColId;});
    if(si<0||ti<0) return;
    var moved=arr.splice(si,1)[0]; arr.splice(ti,0,moved); setCols(arr);
    showT("Colunas reordenadas. A ordem será salva ao publicar.");
  }

  /* ── Discrepâncias (Caso A): menor grav com aceite, mesma especialidade, sem prioridade médica ── */
  const GRAV_PESO_D = {emergencia:1,urgencia:2,andamento_cor:3,menor_gravidade:4,agendamento:99,retorno:99,finalizado_cor:99};
  const discrepancias = useMemo(function(){
    if(!isAdmin) return [];
    var ac=cards.filter(function(c){return c.col_id==="aceite"&&c.rec&&c.rec.trim()&&!c.prioridade_remocao;});
    var pe=cards.filter(function(c){return c.col_id==="pendente"&&c.rec&&c.rec.trim();});
    var out=[];
    ac.forEach(function(a){
      var pA=GRAV_PESO_D[a.grav]||99;
      pe.forEach(function(b){
        if(a.id===b.id) return;
        if(a.rec.trim().toUpperCase()!==b.rec.trim().toUpperCase()) return;
        var pB=GRAV_PESO_D[b.grav]||99;
        if(pA>pB) out.push({id:a.id+"_"+b.id,aceitado:a,pendente:b});
      });
    });
    return out;
  },[cards,isAdmin]);

    const name = newColName.trim();
    if (!name) return;
    const id = "col_" + Date.now();
    try {
      const data = await fn("columns-write", {
        action: "create",
        body: { id, label: name, sub: "", emoji: "📌", col_order: cols.length + 1, accent: "#94A3B8" }
      }, userId);
      setCols(p => [...p, data]);
      setNewColName("");

      showT(`Coluna "${name}" criada.`);
    } catch (ex) {
      showT(ex.message, "err");

  async function removeColumn(id) {
    if (cols.find(c => c.id === id)?.fixed) {
      showT("Coluna fixa.", "err");
      return;
    }
    try {
      await fn("columns-write", { action: "delete", id }, userId);
      setCols(p => p.filter(c => c.id !== id));
      setCards(p => p.map(c => c.col_id === id ? { ...c, col_id: "pendente" } : c));
      showT("Coluna removida.");
    } catch (ex) {
      showT(ex.message, "err");
    }
  }

  /* ── Export functions ── */
  async function exportPNG(targetView) {
    showT("Gerando imagem...");
    if (targetView && targetView !== "kanban") {
      const el = document.getElementById("view-content");
      if (!el) { showT("Nada para capturar.", "err"); return; }
      try {
        const canvas = await html2canvas(el, { scale: 3, backgroundColor: "#F1F5F9", useCORS: true, logging: false });
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "ge-" + targetView + "-" + new Date().toLocaleDateString("pt-BR").replace(/\//g, "-") + ".png";
        a.click();
        showT("PNG exportado!");
      } catch (e) {
        showT("Erro: " + e.message, "err");
      }
      return;
    }
    showT("Gerando imagem do Kanban completo...");
    try {
      const wrap = document.createElement("div");
      wrap.style.cssText = "position:fixed;left:-9999px;top:0;background:#F1F5F9;padding:20px;display:flex;gap:10px;align-items:flex-start;font-family:Inter,system-ui,sans-serif;min-width:max-content;";
      const colsToRender = isAdmin ? cols : pubCols || cols;
      const cardsToRender = isAdmin ? cards : pubCards || [];

        const colCards = cardsToRender.filter(c => c.col_id === col.id);
        const colDiv = document.createElement("div");
        colDiv.style.cssText = "background:#fff;border-radius:10px;border:1px solid #E2E8F0;width:240px;flex-shrink:0;overflow:visible;border-top:3px solid " + (col.accent || "#94A3B8") + ";";
        const hdr = document.createElement("div");
        hdr.style.cssText = "padding:10px 12px;border-bottom:1px solid #F1F5F9;";
        hdr.innerHTML = "<div style='font-weight:700;font-size:12px;color:#0F172A;'>" + (col.emoji || "") + " " + col.label + "</div>" +
          "<div style='font-size:9px;color:#94A3B8;margin-top:1px;'>" + (col.sub || "") + "</div>" +
          "<span style='display:inline-block;background:#F1F5F9;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;color:#475569;margin-top:5px;'>" + colCards.length + "</span>";
        colDiv.appendChild(hdr);
        const body = document.createElement("div");
        body.style.cssText = "padding:8px;";
        colCards.forEach(c => {
          const gc = { emergencia:"#EF4444", urgencia:"#EAB308", andamento_cor:"#F59E0B", menor_gravidade:"#22C55E", finalizado_cor:"#A855F7", agendamento:"#94A3B8", retorno:"#EC4899" };
          const dot = gc[c.grav] || "#EAB308";
          const card = document.createElement("div");
          card.style.cssText = "background:#fff;border:1px solid #E2E8F0;border-left:3px solid " + dot + ";border-radius:8px;padding:9px 10px;margin-bottom:6px;";
          let html = "";
          if (c.pr) html += "<div style='font-size:9px;font-weight:700;color:#94A3B8;margin-bottom:1px;'>#" + c.pr + "</div>";
          html += "<div style='font-weight:600;font-size:12px;color:#0F172A;margin-bottom:4px;'>" + (c.is_rn ? "👶 " : "") + c.nome + "</div>";
          if (c.hd) html += "<div style='font-size:11px;color:#374151;margin-bottom:3px;'><span style='color:#CBD5E1;'>HD: </span>" + c.hd + "</div>";
          if (c.setor || c.rec) html += "<div style='display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px;'>" +
            (c.setor ? "<span style='font-size:10px;background:#F1F5F9;color:#475569;padding:1px 5px;border-radius:3px;'>" + c.setor + "</span>" : "") +
            (c.rec ? "<span style='font-size:10px;background:#EFF6FF;color:#1E40AF;padding:1px 5px;border-radius:3px;'>" + c.rec + "</span>" : "") + "</div>";
          if (c.hosp) html += "<div style='font-size:10px;color:#64748B;'>→ <strong>" + c.hosp + "</strong></div>";
          if (c.cross_info) html += "<div style='font-size:10px;color:#94A3B8;margin-top:2px;'>Cross: " + c.cross_info + "</div>";
          if (c.receptor) html += "<div style='font-size:10px;color:#16A34A;margin-top:2px;'>Receptor: " + c.receptor + "</div>";
          if (c.status) html += "<div style='font-size:9px;font-weight:700;color:#64748B;margin-top:3px;text-transform:uppercase;'>" + c.status + "</div>";

      a.click();
      showT("PNG exportado com sucesso!");

  async function exportExcel() {
    showT("Gerando Excel...");
    try {
      if (!window.XLSX) {
        await new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      const colsData = isAdmin ? cols : pubCols || cols;
      const cardsData = isAdmin ? cards : pubCards || [];
      const colLabel = colsData.reduce((acc, c) => ({ ...acc, [c.id]: c.label }), {});
      const str = v => v === null || v === undefined || v === false ? "" : v === true ? "Sim" : String(v);
      const GRAV_LABEL = { emergencia:"Emergência", urgencia:"Urgência", andamento_cor:"Em andamento", menor_gravidade:"Menor gravidade", finalizado_cor:"Finalizado", agendamento:"Agendamento", retorno:"Retorno" };
      const CAT_LABEL = { normal:"Normal", pediatria:"Pediatria", psiquiatria:"Psiquiatria", obstetricia:"Obstetrícia" };
      const rows = cardsData.map(c => ({
        "Coluna": str(colLabel[c.col_id] || c.col_id),
        "Prioridade": str(c.pr),
        "Status": str(c.status),
        "Categoria": str(CAT_LABEL[c.categoria] || "Normal"),
        "RN": c.is_rn ? "Sim" : "Não",
        "Nome": str(c.nome),
        "Idade": str(c.idade),
        "Admissão": str(c.adm),
        "HD": str(c.hd),
        "Setor/Leito": str(c.setor),
        "Recurso": str(c.rec),
        "Hospital": str(c.hosp),
        "Ambulância": str(c.amb),
        "Cross": str(c.cross_info),
        "Receptor": str(c.receptor),
        "Data Aceite": str(c.data_aceite),
        "Hora Aceite": str(c.hora_aceite),
        "Gravidade": str(GRAV_LABEL[c.grav] || c.grav),
        "Observações": str(c.obs),
        "Saída": str(c.saida),
        "Retorno": str(c.retorno),
        "Criado em": c.created_at ? new Date(c.created_at).toLocaleString("pt-BR") : ""
